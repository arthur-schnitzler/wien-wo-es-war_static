# Baut die Website und veröffentlicht sie auf GitHub Pages.
name: Deploy static content to Pages

on:
  # manuell über Actions → Run workflow
  workflow_dispatch:
  # aus dem Workflow „Update Data from PMB“ des Daten-Repos (braucht dort ein Token-Secret)
  repository_dispatch:
    types: [update-data]

permissions:
  contents: read
  packages: write
  pages: write
  id-token: write

# Nur ein Deployment gleichzeitig; laufende Deployments werden nicht abgebrochen.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      ANT_OPTS: -Xmx6g
      # Typesense-Instanz noch offen (PLANUNG.md, Abschnitt 13)
      TYPESENSE_HOST: typesense.acdh.oeaw.ac.at
      TYPESENSE_PORT: 443
      TYPESENSE_PROTOCOL: https
      TYPESENSE_API_KEY: ${{secrets.TYPESENSE_API_KEY}}
      # Redmine-ID für das Impressum, noch offen; ohne sie entsteht ein Platzhalter
      REDMINE_ID: ${{ vars.REDMINE_ID }}
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: set up uv (Python)
        uses: astral-sh/setup-uv@v10.3.0
      - name: Sync entity assets from schnitzler-chronik-static
        run: python3 check_entities_xsl.py
      - name: Fetch the data
        run: ./shellscripts/fetch_data.sh
      - name: Prepare data (listevent.xml, tage.xml, Kalender-JSON)
        run: uv run pyscripts/prepare_data.py
      - name: Build the app
        run: ant
      - name: Check output (URIs, Weiterleitungen, Kalenderdaten, Größe)
        run: uv run pyscripts/check_output.py
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './html'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
